<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>دخول السيرفر</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial,sans-serif;
    }

    body{
      min-height:100vh;
      background:
      radial-gradient(circle at top,#1e293b 0%,#0f172a 55%,#020617 100%);
      color:white;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:25px;
      overflow:hidden;
    }

    .bg{
      position:absolute;
      width:700px;
      height:700px;
      background:#22c55e20;
      filter:blur(120px);
      border-radius:50%;
      top:-200px;
      left:-200px;
      animation:move 8s infinite alternate ease-in-out;
    }

    @keyframes move{
      from{
        transform:translate(0,0);
      }
      to{
        transform:translate(120px,80px);
      }
    }

    .card{
      position:relative;
      width:100%;
      max-width:750px;
      background:rgba(255,255,255,0.05);
      border:1px solid rgba(255,255,255,0.08);
      backdrop-filter:blur(12px);
      border-radius:28px;
      padding:45px;
      text-align:center;
      box-shadow:0 20px 60px rgba(0,0,0,0.45);
      z-index:1;
    }

    .title{
      font-size:3rem;
      margin-bottom:15px;
    }

    .subtitle{
      color:#cbd5e1;
      line-height:1.9;
      font-size:1.05rem;
      margin-bottom:35px;
    }

    .ip-box{
      background:#0f172a;
      border:1px solid rgba(255,255,255,0.08);
      padding:20px;
      border-radius:18px;
      margin-bottom:30px;
    }

    .ip-label{
      color:#94a3b8;
      margin-bottom:10px;
      font-size:0.95rem;
    }

    .ip{
      font-size:1.5rem;
      font-weight:bold;
      color:#4ade80;
      word-break:break-all;
    }

    .buttons{
      display:flex;
      gap:15px;
      justify-content:center;
      flex-wrap:wrap;
      margin-bottom:25px;
    }

    .btn{
      text-decoration:none;
      padding:15px 24px;
      border-radius:16px;
      font-weight:bold;
      transition:0.25s ease;
      display:inline-block;
    }

    .download{
      background:#22c55e;
      color:white;
    }

    .download:hover{
      transform:translateY(-4px);
      background:#16a34a;
      box-shadow:0 10px 25px #22c55e50;
    }

    .video{
      background:#2563eb;
      color:white;
    }

    .video:hover{
      transform:translateY(-4px);
      background:#1d4ed8;
      box-shadow:0 10px 25px #2563eb50;
    }

    .note{
      margin-top:10px;
      color:#94a3b8;
      font-size:0.92rem;
      line-height:1.8;
    }



    @keyframes pulse{
      0%{
        transform:scale(1);
        opacity:1;
      }
      50%{
        transform:scale(1.5);
        opacity:0.5;
      }
      100%{
        transform:scale(1);
        opacity:1;
      }
    }

    @media(max-width:700px){

      .card{
        padding:30px 22px;
      }

      .title{
        font-size:2.1rem;
      }

      .ip{
        font-size:1.1rem;
      }

      .buttons{
        flex-direction:column;
      }

      .btn{
        width:100%;
      }

    }

  </style>
</head>

<body>

  <div class="bg"></div>

  <div class="card">

    <h1 class="title">🎮 سيرفر ماينيكرافت</h1>

    <p class="subtitle">
      إذا تبي تدخل السيرفر حمّل الملفات المطلوبة
      وبعدها اتبع شرح التثبيت بالفيديو تحت.
    </p>

    <div class="ip-box">

      <div class="ip-label">
        IP السيرفر
      </div>

      <div class="ip">
        alla091y.aternos.me
      </div>

    </div>

    <div class="buttons">

      <a
        class="btn download"
        href="https://drive.google.com/file/d/1aGAG-RAemHBkwk2O0ZF_R8JO7EoVPFIn/view?usp=drive_link"
        target="_blank"
      >
        ⬇ تحميل الملفات
      </a>

      <a
        class="btn video"
        href="https://youtu.be/V_jcBlz1LPU"
        target="_blank"
      >
        ▶ مشاهدة الشرح
      </a>

    </div>

    <p class="note">
      بعض برامج الحماية ممكن تظهر تحذير بسبب نوع الملفات،
      تأكد فقط إنك محملها من الرابط الرسمي الموجود هنا.
    </p>

    <div class="status">
    </div>

  </div>

</body>
</html>
